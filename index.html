<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi Akun - API WA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121824] text-gray-200 min-h-screen flex items-center justify-center p-4">

  <div class="bg-[#1a2332] border border-gray-800 rounded-2xl w-full max-w-md p-8 shadow-2xl">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-white">Form Registrasi</h2>
      <p class="text-xs text-gray-400 mt-1">Lengkapi data diri untuk membuat akun baru</p>
    </div>

    <form action="api/register.php" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">Nama Lengkap</label>
        <input type="text" name="nama" required placeholder="Budi Santoso" class="w-full bg-[#243044] border border-gray-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-[#22c55e]">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">Email</label>
        <input type="email" name="email" required placeholder="budi@gmail.com" class="w-full bg-[#243044] border border-gray-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-[#22c55e]">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">Nomor WhatsApp</label>
        <input type="text" name="no_hp" required placeholder="081234567890" class="w-full bg-[#243044] border border-gray-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-[#22c55e]">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">Alamat</label>
        <textarea name="alamat" rows="2" required placeholder="Ponorogo" class="w-full bg-[#243044] border border-gray-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-[#22c55e] resize-none"></textarea>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">Password</label>
        <input type="password" name="password" required placeholder="********" class="w-full bg-[#243044] border border-gray-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-[#22c55e]">
      </div>

      <button type="submit" class="w-full bg-[#22c55e] hover:bg-[#16a34a] text-white font-bold py-2.5 rounded-xl transition shadow-lg mt-2">
        Daftar Sekarang
      </button>
    </form>
  </div>

</body>
</html>
